project_id = "saengak_web"

# Local Google OAuth configuration. Keep both values in the root .env file;
# production credentials are managed separately in the Supabase dashboard.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.get-articles]
verify_jwt = false

[functions.get-collections]
verify_jwt = false

[functions.get-products]
verify_jwt = false

[functions.get-products-by-tag]
verify_jwt = false

[functions.smart-search]
verify_jwt = false

[functions.shopify-orders-webhook]
verify_jwt = false

# Uses its own constant-time AmegoDispatchToken check because it is called by
# a scheduler/worker rather than a browser Supabase session.
[functions.amego-invoice-dispatch]
verify_jwt = false
