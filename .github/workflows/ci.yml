name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security regression tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Verify public content and build assets
        run: npm run verify:content

      - name: Verify Supabase static baseline
        run: npm run verify:supabase

      # Production dependencies must be free of moderate+ advisories. The full tree
      # (including dev-only tooling) is gated at critical: the remaining dev-only
      # advisories come from `braces`, which has no patched release, via Tailwind CSS 3
      # and the Vercel CLI. See docs/PROJECT_STATUS.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (critical)
        run: npm audit --audit-level=critical
