name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security regression tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Verify public content and build assets
        run: npm run verify:content

      - name: Verify Supabase static baseline
        run: npm run verify:supabase

      # 比照 LUCISSI：上線的套件（dependencies）維持 moderate 門檻；開發工具只擋 critical。
      # 2026-11-18 picomatch ReDoS（GHSA-fc5q-39xc-vjpf，<=4.0.7 尚無修正版）只在 vite／vitest 等開發工具，不進正式網站。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (critical only)
        run: npm audit --audit-level=critical
