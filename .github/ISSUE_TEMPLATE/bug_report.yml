name: Bug report
description: Report a reproducible application or developer-tooling defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, customer/order/payment data, private screenshots, cookies or tokens.
        Security vulnerabilities must use Private Vulnerability Reporting instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Branch and commit SHA
      placeholder: codex/example @ abc1234
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Preview deployment
        - Production public surface
        - Supabase local stack
        - Owner-controlled external system
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove all sensitive and personal data before attaching evidence.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, personal data, order/payment identifiers and private account material.
          required: true
